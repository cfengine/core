name: Reactor Tests

on:
  workflow_call

jobs:
  reactor_tests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Install dependencies
      run: ./ci/dependencies.sh
    - name: Run autotools / configure
      run: ./autogen.sh --enable-debug
    - name: Compile and link (make)
      run: make -j8 CFLAGS="-Werror -Wall"
    - name: Run reactor tests
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        ln -s "$PWD/cf-reactor/cf-reactor" "$PWD/cf-promises/cf-promises" "$RUNNER_TEMP/bin/"
        cd tests/reactor
        chmod -R go-w .
        CF_BINDIR="$RUNNER_TEMP/bin" sh run.sh
